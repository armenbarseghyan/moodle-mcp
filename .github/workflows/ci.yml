name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: go test (no race detector on Windows runners)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint # go vet, golangci-lint, shellcheck (preinstalled on the runner)

  setup:
    name: setup script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # setup.sh end to end, plus setup.ps1's interactive login (pwsh is preinstalled)
      - run: make setup-test

  setup-windows:
    name: setup script (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: setup.ps1 with PowerShell 7
        shell: pwsh
        run: ./dev/setup_test.ps1
      - name: setup.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: ./dev/setup_test.ps1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=10s
